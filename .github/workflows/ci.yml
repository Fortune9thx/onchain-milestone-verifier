name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install GenLayer test toolchain
        run: |
          python -m pip install --upgrade pip
          pip install genlayer-test==0.29.2 genvm-linter==0.11.0 Pillow

      - name: genvm-lint check (must be zero warnings)
        run: genvm-lint check contracts/OnChainMilestoneVerifier.py

      - name: genvm-lint validate (SDK-based semantic validation)
        run: genvm-lint validate contracts/OnChainMilestoneVerifier.py

      - name: Direct-mode test suite
        run: gltest tests/direct/test_onchain_milestone_verifier.py -v
